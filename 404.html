---
layout: default
title: Not found
permalink: /404.html
sitemap: false
---
<section class="not-found">
  <h1 class="big-404">404</h1>
  <p class="nf-out"><span id="nf-path">This page</span>: No such file or directory</p>
  <div class="ls-grid">
    {% for item in site.nav %}<a href="{{ item.url | relative_url }}">{{ item.title }}/</a>{% endfor %}
  </div>
</section>
<script>
  (function () {
    var el = document.getElementById("nf-path");
    if (el) el.textContent = location.pathname;
  })();
</script>
